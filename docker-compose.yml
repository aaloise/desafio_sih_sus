version: '3.8'

services:
  api-radar-sus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar_sih_sus_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=./mlruns
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - radar-net

networks:
  radar-net:
    driver: bridge
